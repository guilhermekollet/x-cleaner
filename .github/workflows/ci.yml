name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run tests
        run: node --test
      - name: Validate manifest.json
        run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) throw new Error('expected manifest v3'); JSON.stringify(m); console.log('manifest ok, version '+m.version)"
      - name: Check the version matches package.json
        run: node -e "const a=require('./manifest.json').version,b=require('./package.json').version; if(a!==b) throw new Error('manifest '+a+' != package '+b); console.log('version '+a)"
      - name: Check the icons are present and valid PNGs
        # The icon generator's PNG bytes vary a little between platforms (zlib), so
        # CI checks the files are there and well-formed rather than byte-identical.
        run: |
          node -e '
            const fs = require("fs");
            const sig = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
            for (const s of [16, 32, 48, 128]) {
              const p = `icons/icon-${s}.png`;
              const head = fs.readFileSync(p).subarray(0, 8);
              if (!head.equals(sig)) throw new Error(`${p} is not a valid PNG`);
              console.log(`${p} ok`);
            }
          '

  web:
    name: Website (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
