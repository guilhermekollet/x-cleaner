<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>X Cleaner</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body class="page">
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true" fill="none">
          <path d="M34 11 L22 27" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" />
          <path d="M14 29 h12 l4 9 h-20 z" fill="currentColor" opacity="0.5" />
          <path d="M14 29 h12 v3 h-12 z" fill="currentColor" />
          <path d="M11 38 v-2 M16 38 v-3 M21 38 v-2 M26 38 v-3 M31 38 v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="33" cy="31" r="1.4" fill="currentColor" />
          <circle cx="37" cy="34" r="1.1" fill="currentColor" />
          <circle cx="35" cy="38" r="1" fill="currentColor" />
        </svg>
        <div>
          <h1>X Cleaner</h1>
          <p class="tagline" data-i18n="history.tagline"></p>
        </div>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="pt">PT</button>
      </div>
    </header>

    <main>
      <h2 class="page-title" data-i18n="history.title"></h2>
      <p class="private-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" /><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3" /></svg>
        <span data-i18n="history.private"></span>
      </p>

      <!-- One tab per account with a history; shown only when there is more than one. -->
      <div id="accounts" class="accounts hidden" role="tablist" data-i18n-title="history.account"></div>

      <section class="overview">
        <div class="overview-count">
          <b id="total">0</b>
          <span id="accountName" class="account-name"></span>
        </div>
        <div class="overview-actions">
          <button id="downloadJson" type="button" class="btn btn-solid">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14" /></svg>
            <span data-i18n="history.json"></span>
          </button>
          <button id="downloadCsv" type="button" class="btn btn-outline">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14" /></svg>
            <span data-i18n="history.csv"></span>
          </button>
          <button id="clear" type="button" class="btn btn-ghost" data-i18n="history.clear"></button>
        </div>
      </section>

      <section id="browse" class="browse">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.4-4.4" /></svg>
          <input type="search" id="query" autocomplete="off" spellcheck="false" data-i18n-placeholder="history.search" />
        </label>
        <div id="kinds" class="chips kinds" role="radiogroup"></div>
        <p id="showing" class="showing" aria-live="polite"></p>
        <ol id="list" class="records"></ol>
        <button id="more" type="button" class="btn btn-outline btn-block hidden"></button>
      </section>

      <div id="empty" class="empty hidden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" /><path d="M3.5 4v4h4M12 7.5V12l3 2" /></svg>
        <b id="emptyTitle"></b>
        <p id="emptyText"></p>
      </div>
    </main>

    <dialog id="confirmClear" class="dialog">
      <form method="dialog">
        <h2 data-i18n="history.confirmTitle"></h2>
        <p id="confirmText"></p>
        <div class="dialog-actions">
          <button type="button" id="confirmJson" class="btn btn-outline">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14" /></svg>
            <span data-i18n="history.json"></span>
          </button>
          <span class="grow"></span>
          <button value="cancel" class="btn btn-outline" data-i18n="history.cancel"></button>
          <button value="clear" class="btn btn-solid" data-i18n="history.confirmClear"></button>
        </div>
      </form>
    </dialog>

    <footer class="foot">
      <span class="private">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" /><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3" /></svg>
        <span data-i18n="foot.private"></span>
      </span>
      ·
      <a href="https://github.com/guilhermekollet/x-cleaner" target="_blank" rel="noopener" data-i18n="foot.source"></a>
    </footer>

    <script src="i18n.js"></script>
    <script src="history.js"></script>
    <script src="history-page.js"></script>
  </body>
</html>
