<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>X Cleaner</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true" fill="none">
          <path d="M34 11 L22 27" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" />
          <path d="M14 29 h12 l4 9 h-20 z" fill="currentColor" opacity="0.5" />
          <path d="M14 29 h12 v3 h-12 z" fill="currentColor" />
          <path d="M11 38 v-2 M16 38 v-3 M21 38 v-2 M26 38 v-3 M31 38 v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="33" cy="31" r="1.4" fill="currentColor" />
          <circle cx="37" cy="34" r="1.1" fill="currentColor" />
          <circle cx="35" cy="38" r="1" fill="currentColor" />
        </svg>
        <div>
          <h1>X Cleaner</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="pt">PT</button>
      </div>
    </header>

    <p id="account" class="status" data-state="unknown">
      <span class="dot" aria-hidden="true"></span>
      <span id="accountText" data-i18n="status.checking"></span>
    </p>

    <main id="setup">
      <section class="block">
        <h2 data-i18n="source.title"></h2>
        <div class="choices">
          <label class="choice">
            <input type="radio" name="source" value="timeline" checked />
            <span class="choice-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg><b data-i18n="source.timeline"></b></span>
            <small data-i18n="source.timelineHint"></small>
          </label>
          <label class="choice">
            <input type="radio" name="source" value="archive" />
            <span class="choice-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h17v11a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" /><path d="M2.5 4h19v3.5h-19zM10 11.5h4" /></svg><b data-i18n="source.archive"></b></span>
            <small data-i18n="source.archiveHint"></small>
          </label>
        </div>

        <div id="archiveRow" class="archive hidden">
          <!-- In the toolbar popup the file dialog would close the popup (Chrome on macOS and
               Linux), so there the picker opens this same page in a tab instead. -->
          <button id="pickInTab" type="button" class="btn btn-outline btn-block hidden">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" /></svg>
            <span data-i18n="archive.pickInTab"></span>
          </button>
          <label id="pickFile" class="btn btn-outline btn-block hidden">
            <input type="file" id="archiveFile" accept=".zip,.js" multiple />
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" /></svg>
            <span data-i18n="archive.pick"></span>
          </label>
          <p class="hint tab-only" data-i18n="archive.help"></p>
          <div id="archiveSummary" class="summary hidden"></div>
        </div>
      </section>

      <section class="block needs-setup">
        <h2 data-i18n="types.title"></h2>
        <div class="chips">
          <label class="chip"><input type="checkbox" id="t-post" checked /><span data-i18n="types.post"></span></label>
          <label class="chip"><input type="checkbox" id="t-reply" checked /><span data-i18n="types.reply"></span></label>
          <label class="chip"><input type="checkbox" id="t-repost" checked /><span data-i18n="types.repost"></span></label>
          <label class="chip"><input type="checkbox" id="t-like" /><span data-i18n="types.like"></span></label>
        </div>
        <p id="likeHint" class="hint hidden" data-i18n="types.likeHint"></p>
      </section>

      <section class="block needs-setup">
        <h2 data-i18n="speed.title"></h2>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="speed" value="cautious" /><span data-i18n="speed.cautious"></span></label>
          <label><input type="radio" name="speed" value="normal" checked /><span data-i18n="speed.normal"></span></label>
          <label><input type="radio" name="speed" value="fast" /><span data-i18n="speed.fast"></span></label>
        </div>
      </section>

      <details class="block filters needs-setup">
        <summary><span data-i18n="filters.title"></span></summary>
        <label class="field"><span data-i18n="filters.keyword"></span><input type="text" id="f-keyword" data-i18n-placeholder="filters.keywordPh" /></label>
        <div class="field-row">
          <label class="field"><span data-i18n="filters.since"></span><input type="date" id="f-since" /></label>
          <label class="field"><span data-i18n="filters.until"></span><input type="date" id="f-until" /></label>
        </div>
        <label class="field"><span data-i18n="filters.keep"></span><input type="text" id="f-keep" data-i18n-placeholder="filters.keepPh" /></label>
        <label class="check quiet"><input type="checkbox" id="skipTest" /><span data-i18n="test.skip"></span></label>
        <label class="check quiet"><input type="checkbox" id="resumePrev" /><span><span data-i18n="resume"></span> <small data-i18n="resumeHint"></small></span></label>
      </details>

      <!-- After a successful test: the full run picks up where the test stopped. -->
      <p id="fullBanner" class="banner needs-setup hidden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        <span data-i18n="full.banner"></span>
      </p>

      <section class="confirm needs-setup">
        <label class="check"><input type="checkbox" id="ack" /><span data-i18n="confirm.ack"></span></label>
        <label id="typeRow" class="type-row hidden"><span id="typeLabel"></span><input type="text" id="confirmWord" autocomplete="off" spellcheck="false" /></label>
      </section>

      <button id="start" type="button" class="btn btn-danger btn-block btn-lg needs-setup" disabled></button>
    </main>

    <section id="progress" class="run hidden">
      <div class="counters">
        <div><b id="p-deleted" class="ok">0</b><span data-i18n="run.deleted"></span></div>
        <div><b id="p-gone">0</b><span data-i18n="run.gone"></span></div>
        <div><b id="p-failures" class="bad">0</b><span data-i18n="run.failures"></span></div>
      </div>
      <div id="p-bar" class="bar"><i></i></div>
      <p id="p-status" class="run-status"></p>
      <div class="actions">
        <button id="pause" type="button" class="btn btn-outline" data-i18n="run.pause"></button>
        <button id="resume" type="button" class="btn btn-outline hidden" data-i18n="run.resume"></button>
        <button id="stop" type="button" class="btn btn-outline" data-i18n="run.stop"></button>
        <button id="again" type="button" class="btn btn-solid btn-block hidden" data-i18n="run.again"></button>
        <button id="viewProfile" type="button" class="btn btn-outline hidden" data-i18n="testDone.view"></button>
        <button id="continueFull" type="button" class="btn btn-solid grow hidden" data-i18n="testDone.continue"></button>
      </div>
    </section>

    <footer class="foot">
      <span class="private">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" /><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3" /></svg>
        <span data-i18n="foot.private"></span>
      </span>
      ·
      <a href="https://github.com/guilhermekollet/x-cleaner" target="_blank" rel="noopener" data-i18n="foot.source"></a>
    </footer>

    <script src="archive.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
