<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>X Cleaner</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true" fill="none">
          <path d="M34 11 L22 27" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" />
          <path d="M14 29 h12 l4 9 h-20 z" fill="currentColor" opacity="0.5" />
          <path d="M14 29 h12 v3 h-12 z" fill="currentColor" />
          <path d="M11 38 v-2 M16 38 v-3 M21 38 v-2 M26 38 v-3 M31 38 v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="33" cy="31" r="1.4" fill="currentColor" />
          <circle cx="37" cy="34" r="1.1" fill="currentColor" />
          <circle cx="35" cy="38" r="1" fill="currentColor" />
        </svg>
        <div>
          <h1>X Cleaner</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
      </div>
      <div class="top-actions">
        <!-- The history opens in a tab of its own: it needs more room than the popup's 600px. -->
        <button id="openHistory" type="button" class="pill-link" data-i18n-title="history.openLabel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" /><path d="M3.5 4v4h4M12 7.5V12l3 2" /></svg>
          <span data-i18n="history.open"></span>
          <b id="historyCount" class="count hidden"></b>
        </button>
        <div class="lang" role="group" aria-label="Language · Idioma">
          <span class="thumb" aria-hidden="true"></span>
          <button type="button" data-lang="en" aria-label="English" title="English"><svg class="flag" viewBox="0 0 24 24" aria-hidden="true"><clipPath id="clip-us"><circle cx="12" cy="12" r="12" /></clipPath><g clip-path="url(#clip-us)"><rect width="24" height="24" fill="#fff" /><path fill="#b22234" d="M0 0h24v1.85H0zM0 3.7h24v1.85H0zM0 7.4h24v1.85H0zM0 11.1h24v1.85H0zM0 14.8h24v1.85H0zM0 18.5h24v1.85H0zM0 22.15h24V24H0z" /><rect width="11" height="12.95" fill="#3c3b6e" /></g></svg></button>
          <button type="button" data-lang="pt" aria-label="Português (Brasil)" title="Português (Brasil)"><svg class="flag" viewBox="0 0 24 24" aria-hidden="true"><clipPath id="clip-br"><circle cx="12" cy="12" r="12" /></clipPath><g clip-path="url(#clip-br)"><rect width="24" height="24" fill="#009c3b" /><path fill="#ffdf00" d="M12 4.2 21.6 12 12 19.8 2.4 12z" /><circle cx="12" cy="12" r="4.4" fill="#002776" /><path d="M7.8 11.1a9 9 0 0 1 8.3 2" stroke="#fff" stroke-width="0.9" fill="none" /></g></svg></button>
        </div>
      </div>
    </header>

    <p id="account" class="status" data-state="unknown">
      <span class="dot" aria-hidden="true"></span>
      <span id="accountText" data-i18n="status.checking"></span>
    </p>

    <main id="setup">
      <section class="block">
        <h2 data-i18n="source.title"></h2>
        <div class="choices">
          <label class="choice">
            <input type="radio" name="source" value="timeline" checked />
            <span class="choice-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg><b data-i18n="source.timeline"></b></span>
            <small id="timelineHint" data-i18n="source.timelineHint"></small>
          </label>
          <label class="choice">
            <input type="radio" name="source" value="archive" />
            <span class="choice-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h17v11a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" /><path d="M2.5 4h19v3.5h-19zM10 11.5h4" /></svg><b data-i18n="source.archive"></b></span>
            <small data-i18n="source.archiveHint"></small>
          </label>
        </div>

        <div id="archiveRow" class="archive hidden">
          <!-- In the toolbar popup the file dialog would close the popup (Chrome on macOS and
               Linux), so there the picker opens this same page in a tab instead. -->
          <button id="pickInTab" type="button" class="btn btn-outline btn-block hidden">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" /></svg>
            <span data-i18n="archive.pickInTab"></span>
          </button>
          <label id="pickFile" class="btn btn-outline btn-block hidden">
            <input type="file" id="archiveFile" accept=".zip,.js" multiple />
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" /></svg>
            <span data-i18n="archive.pick"></span>
          </label>
          <p class="hint tab-only" data-i18n="archive.help"></p>
          <div id="archiveSummary" class="summary hidden"></div>
        </div>
      </section>

      <section class="block needs-setup">
        <h2 data-i18n="types.title"></h2>
        <div class="chips">
          <label class="chip"><input type="checkbox" id="t-post" checked /><span data-i18n="types.post"></span></label>
          <label class="chip"><input type="checkbox" id="t-reply" checked /><span data-i18n="types.reply"></span></label>
          <label class="chip"><input type="checkbox" id="t-repost" checked /><span data-i18n="types.repost"></span></label>
          <label class="chip"><input type="checkbox" id="t-like" /><span data-i18n="types.like"></span></label>
        </div>
        <p id="likeHint" class="hint hidden" data-i18n="types.likeHint"></p>
      </section>

      <section class="block needs-setup">
        <h2 data-i18n="speed.title"></h2>
        <!-- Icons: Phosphor Icons, fill weight (MIT License, Copyright (c) 2023 Phosphor Icons,
             https://github.com/phosphor-icons/core). -->
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="speed" value="cautious" /><span class="seg"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M120,48a32,32,0,1,1,32,32A32,32,0,0,1,120,48Zm88,88c-28.64,0-41.81-13.3-55.75-27.37-3.53-3.57-7.18-7.26-11-10.58-37-32.14-96.22,22.73-98.72,25.08a8,8,0,0,0,10.95,11.66A163.88,163.88,0,0,1,84,113c13.78-7.38,25.39-10.23,34.7-8.58L64.66,228.81a8,8,0,0,0,4.15,10.52A7.84,7.84,0,0,0,72,240a8,8,0,0,0,7.34-4.81l33.59-77.27L144,180.12V232a8,8,0,0,0,16,0V176a8,8,0,0,0-3.35-6.51l-37.2-26.57L132.88,112c2.64,2.44,5.26,5.07,8,7.84C155.05,134.19,172.69,152,208,152a8,8,0,0,0,0-16Z" /></svg><span data-i18n="speed.cautious"></span></span></label>
          <label><input type="radio" name="speed" value="normal" checked /><span class="seg"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M120,56a32,32,0,1,1,32,32A32,32,0,0,1,120,56Zm103.28,74.08a8,8,0,0,0-10.6-4c-.25.12-26.71,10.72-72.18-20.19-52.29-35.54-88-7.77-89.51-6.57a8,8,0,1,0,10,12.48c.26-.21,25.12-19.5,64.07,3.27-4.25,13.35-12.76,31.82-25.25,47-18.56,22.48-41.11,32.56-67,30A8,8,0,0,0,31.2,208a92.29,92.29,0,0,0,9.34.47c27.38,0,52-12.38,71.63-36.18.57-.69,1.14-1.4,1.69-2.1C133.31,175.29,168,190.3,168,232a8,8,0,0,0,16,0c0-24.65-10.08-45.35-29.15-59.86a104.29,104.29,0,0,0-31.31-15.81A169.31,169.31,0,0,0,139,124c26.14,16.09,46.84,20,60.69,20,12.18,0,19.06-3,19.67-3.28A8,8,0,0,0,223.28,130.08Z" /></svg><span data-i18n="speed.normal"></span></span></label>
          <label><input type="radio" name="speed" value="fast" /><span class="seg"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M213.85,125.46l-112,120a8,8,0,0,1-13.69-7l14.66-73.33L45.19,143.49a8,8,0,0,1-3-13l112-120a8,8,0,0,1,13.69,7L153.18,90.9l57.63,21.61a8,8,0,0,1,3,12.95Z" /></svg><span data-i18n="speed.fast"></span></span></label>
        </div>
        <!-- How many per run, and in which order. Batches stop when full and offer the next one. -->
        <div class="run-options">
          <label class="select-pill">
            <svg class="lead" viewBox="0 0 256 256" aria-hidden="true"><path d="M220,169.09l-92,53.65L36,169.09A8,8,0,0,0,28,182.91l96,56a8,8,0,0,0,8.06,0l96-56A8,8,0,1,0,220,169.09Z" /><path d="M220,121.09l-92,53.65L36,121.09A8,8,0,0,0,28,134.91l96,56a8,8,0,0,0,8.06,0l96-56A8,8,0,1,0,220,121.09Z" /><path d="M28,86.91l96,56a8,8,0,0,0,8.06,0l96-56a8,8,0,0,0,0-13.82l-96-56a8,8,0,0,0-8.06,0l-96,56a8,8,0,0,0,0,13.82Z" /></svg>
            <select id="batch" data-i18n-title="batch.label"></select>
            <svg class="caret" viewBox="0 0 256 256" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,48,88H208a8,8,0,0,1,5.66,13.66Z" /></svg>
          </label>
          <label class="select-pill">
            <svg class="lead order-newest" viewBox="0 0 256 256" aria-hidden="true"><path d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,72h40a8,8,0,0,1,0,16H72a8,8,0,0,1,0-16Zm0,48h48a8,8,0,0,1,0,16H72a8,8,0,0,1,0-16Zm96,64H72a8,8,0,0,1,0-16h96a8,8,0,0,1,0,16Zm29.66-82.34a8,8,0,0,1-11.32,0L176,91.31V136a8,8,0,0,1-16,0V91.31l-10.34,10.35a8,8,0,0,1-11.32-11.32l24-24a8,8,0,0,1,11.32,0l24,24A8,8,0,0,1,197.66,101.66Z" /></svg>
            <svg class="lead order-oldest hidden" viewBox="0 0 256 256" aria-hidden="true"><path d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,72h96a8,8,0,0,1,0,16H72a8,8,0,0,1,0-16Zm40,112H72a8,8,0,0,1,0-16h40a8,8,0,0,1,0,16Zm8-48H72a8,8,0,0,1,0-16h48a8,8,0,0,1,0,16Zm77.66,29.66-24,24a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L160,164.69V120a8,8,0,0,1,16,0v44.69l10.34-10.35a8,8,0,0,1,11.32,11.32Z" /></svg>
            <select id="order" data-i18n-title="order.label"></select>
            <svg class="caret" viewBox="0 0 256 256" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,48,88H208a8,8,0,0,1,5.66,13.66Z" /></svg>
          </label>
        </div>
      </section>

      <details class="block filters needs-setup">
        <summary><span data-i18n="filters.title"></span></summary>
        <label class="field"><span data-i18n="filters.keyword"></span><input type="text" id="f-keyword" data-i18n-placeholder="filters.keywordPh" /></label>
        <div class="field-row">
          <label class="field"><span data-i18n="filters.since"></span><input type="date" id="f-since" /></label>
          <label class="field"><span data-i18n="filters.until"></span><input type="date" id="f-until" /></label>
        </div>
        <label class="field"><span data-i18n="filters.keep"></span><input type="text" id="f-keep" data-i18n-placeholder="filters.keepPh" /></label>
        <label class="check quiet"><input type="checkbox" id="resumePrev" /><span><span data-i18n="resume"></span> <small data-i18n="resumeHint"></small></span></label>
      </details>

      <!-- After a successful test: the full run picks up where the test stopped. -->
      <p id="fullBanner" class="banner needs-setup hidden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        <span data-i18n="full.banner"></span>
      </p>

      <!-- The 5-item test is a choice, on only until the first run (popup.js sets it). -->
      <label class="switch-row needs-setup">
        <b data-i18n="test.first"></b>
        <input type="checkbox" id="testFirst" role="switch" />
      </label>

      <button id="start" type="button" class="btn btn-danger btn-block btn-lg needs-setup" disabled></button>
    </main>

    <section id="progress" class="run hidden">
      <div class="counters">
        <div><b id="p-deleted" class="ok">0</b><span data-i18n="run.deleted"></span></div>
        <div><b id="p-gone">0</b><span data-i18n="run.gone"></span></div>
        <div><b id="p-failures" class="bad">0</b><span data-i18n="run.failures"></span></div>
      </div>
      <div id="p-bar" class="bar"><i></i></div>
      <p id="p-status" class="run-status"></p>
      <div class="actions">
        <button id="pause" type="button" class="btn btn-outline" data-i18n="run.pause"></button>
        <button id="resume" type="button" class="btn btn-outline hidden" data-i18n="run.resume"></button>
        <button id="stop" type="button" class="btn btn-outline" data-i18n="run.stop"></button>
        <button id="again" type="button" class="btn btn-solid btn-block hidden" data-i18n="run.again"></button>
        <button id="viewProfile" type="button" class="btn btn-outline hidden" data-i18n="testDone.view"></button>
        <button id="continueFull" type="button" class="btn btn-solid grow hidden" data-i18n="testDone.continue"></button>
        <button id="nextBatch" type="button" class="btn btn-solid grow hidden" data-i18n="run.next"></button>
      </div>
    </section>

    <script src="history.js"></script>
    <script src="archive.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
